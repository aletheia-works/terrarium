version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: ci"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "bun"
    directory: "/packages/terrarium"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: js"
    commit-message:
      prefix: "chore(deps)"
    groups:
      terrarium-deps:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "daily"
    labels:
      - "type: chore"
      - "scope: docs"
    commit-message:
      prefix: "chore(deps)"
    groups:
      documentation-deps:
        patterns:
          - "*"
