"scope: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/release.yml"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - "mise.toml"
          - "mise-tasks/**"
          - "scripts/**"
          - ".gitignore"
          - ".editorconfig"
          - ".gitattributes"

"scope: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"

"scope: infra":
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"

"scope: rust":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - "**/rust-toolchain*"

"scope: js":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.{js,jsx,ts,tsx,mjs,cjs}"
          - "**/package.json"
          - "**/bun.lock"
          - "**/tsconfig*.json"
          - "**/*.css"
          - "**/jsr.json"

"scope: wasm":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.wasm"
          - "**/*.wat"
          - "mise-tasks/build/*.sh"

"type: docs":
  - changed-files:
      - any-glob-to-all-files:
          - "**/*.md"
          - "LICENSE"
