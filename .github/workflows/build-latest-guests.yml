name: Build and verify latest guests
on:
  workflow_call:
    inputs:
      ref_repository:
        type: string
        default: ""
      ref_tool:
        type: string
        default: ""
      tool_ref:
        type: string
        default: ""
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # PR runs cancel older revisions; reusable Pages calls remain independent.
  group: latest-guests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref_matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun node rust
      - name: Resolve all source identities once
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REF_REPOSITORY: ${{ inputs.ref_repository }}
          TOOL_REF: ${{ inputs.tool_ref }}
          REF_TOOL: ${{ inputs.ref_tool }}
        run: |
          node scripts/latest-guests.mjs resolve .vendor/native/resolutions.json
          matrix=$(node scripts/tool-refs.mjs resolve web/tool-refs.json .vendor/native/tool-ref-resolutions.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-resolutions
          path: .vendor/native/*.json
          retention-days: 7
  latest:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun node rust
      - name: Install native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools cmake make perl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-resolutions
          path: .vendor/native
      - name: Cache compilation dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .vendor/native/cargo
          key: native-musl-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise-tasks/build/native.sh', '.vendor/native/resolutions.json') }}
          restore-keys: native-musl-${{ runner.os }}-
      - name: Prepare the pinned runtime and resolver
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          bash mise-tasks/terrarium/prepare.sh --url "$FORMICARIUM_INPUTS_URL"
          cd packages/terrarium
          bun install --frozen-lockfile
      - name: Acquire latest stable guests
        run: node scripts/latest-guests.mjs build .vendor/native/resolutions.json .vendor/native
      - name: Stage latest stable guests
        run: node scripts/latest-guests.mjs stage .vendor/native/resolutions.json .vendor/latest-guests .vendor/formicarium-inputs/resolver
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-base
          path: .vendor/latest-guests
          retention-days: 7
  refs:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.ref_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun node rust
      - name: Install native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools cmake make perl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-resolutions
          path: .vendor/native
      - name: Cache compilation dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .vendor/native/cargo
          key: ${{ matrix.tool }}-musl-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('mise.toml', 'mise-tasks/build/native.sh') }}-${{ matrix.commit }}
          restore-keys: |
            ${{ matrix.tool }}-musl-${{ runner.os }}-${{ matrix.name }}-
            native-musl-${{ runner.os }}-
      - name: Prepare the pinned runtime and resolver
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          bash mise-tasks/terrarium/prepare.sh --url "$FORMICARIUM_INPUTS_URL"
          cd packages/terrarium
          bun install --frozen-lockfile
      - name: Build one resolved source ref
        env:
          BUILD_TOOL: ${{ matrix.tool }}
          BUILD_NAME: ${{ matrix.name }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/.vendor/native/cargo
        run: |
          started=$(date +%s)
          node scripts/tool-refs.mjs build .vendor/native/tool-ref-resolutions.json "$BUILD_TOOL" "$BUILD_NAME" .vendor/ref-output .vendor/formicarium-inputs/resolver .vendor/native/resolutions.json
          elapsed=$(( $(date +%s) - started ))
          echo "$BUILD_TOOL $BUILD_NAME: ${elapsed}s (resolved commit ${{ matrix.commit }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-ref-${{ matrix.tool }}-${{ matrix.name }}
          path: |
            .vendor/ref-output/${{ matrix.tool }}
            .vendor/ref-output/${{ matrix.tool }}.json
          retention-days: 7
  candidate:
    needs: [resolve, latest, refs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun node rust
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-resolutions
          path: .vendor/native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latest-base
          path: .vendor/latest-guests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tool-ref-*
          path: .vendor/tool-refs
      - name: Prepare the pinned runtime and resolver
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          bash mise-tasks/terrarium/prepare.sh --url "$FORMICARIUM_INPUTS_URL"
          cd packages/terrarium
          bun install --frozen-lockfile
      - name: Register source builds and assemble candidate
        env:
          TERRARIUM_GUEST_SITE: .vendor/latest-guests
        run: |
          node scripts/tool-refs.mjs stage .vendor/native/tool-ref-resolutions.json .vendor/tool-refs .vendor/latest-guests .vendor/formicarium-inputs/resolver
          bash mise-tasks/site/build.sh .vendor/site-latest
      - name: Verify source refs and configured reproductions in Node
        run: node scripts/check-tool-refs.mjs .vendor/site-latest
      - name: Verify latest stable versions in Node
        run: node scripts/check-latest-guests.mjs .vendor/site-latest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-guests
          path: .vendor/latest-guests
          retention-days: 7
      - name: Save source acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-guest-evidence
          path: |
            .vendor/native/*.json
            .vendor/tool-refs/*/*.json
          retention-days: 7
  E2E:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun node rust
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latest-guests
          path: .vendor/latest-guests
      - name: Prepare the pinned runtime and resolver
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          bash mise-tasks/terrarium/prepare.sh --url "$FORMICARIUM_INPUTS_URL"
          cd packages/terrarium
          bun install --frozen-lockfile
      - name: Assemble accepted guests
        env:
          TERRARIUM_GUEST_SITE: .vendor/latest-guests
        run: bash mise-tasks/site/build.sh .vendor/site-latest
      - name: Install browser
        working-directory: packages/terrarium
        env:
          BROWSER: ${{ matrix.browser }}
        run: bun x playwright install --with-deps "$BROWSER"
      - name: Verify latest stable and comparison builds
        working-directory: packages/terrarium
        env:
          BROWSER: ${{ matrix.browser }}
        run: TERRARIUM_BUN=$(command -v bun) TERRARIUM_SITE_DIR=$(pwd)/../../.vendor/site-latest bun x playwright test --config playwright.latest.config.ts --project="$BROWSER"
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-guest-browser-${{ matrix.browser }}
          path: packages/terrarium/test-results/latest
          retention-days: 7
  guests:
    # Preserve the required check and make skipped/failed dependencies fail closed.
    if: always()
    needs: [resolve, latest, refs, candidate, E2E]
    runs-on: ubuntu-latest
    steps:
      - name: Require all build and acceptance jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
