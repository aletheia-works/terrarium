name: Polyglot lint autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Polyglot lint autofix
    if: github.repository_owner == 'aletheia-works'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          experimental: true

      # The fixers exit non-zero when an issue is left that they cannot fix
      # (Biome does so after applying the fixes it can), so a failure here
      # must not drop the patch. It is reported as a warning instead, and
      # Polyglot lint, a required check, fails the PR for whatever is left.
      - name: Run polyglot lint autofix
        run: |
          if ! mise run lint:all:fix; then
            echo "::warning::lint:all:fix exited non-zero: an issue it cannot fix is left, or a tool failed. Polyglot lint reports what remains."
          fi

      - name: Capture autofix patch
        run: |
          set -euo pipefail
          mkdir -p autofix-out
          git diff --binary > autofix-out/autofix.patch
          if [ -s autofix-out/autofix.patch ]; then
            echo "Autofix produced changes in:"
            git diff --name-only
          else
            echo "No autofix changes."
          fi

      - name: Upload autofix patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-autofix-patch
          path: autofix-out/autofix.patch
          retention-days: 1
          if-no-files-found: error
