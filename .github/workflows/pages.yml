# Build aube for the browser terminal and publish the site on GitHub Pages.
#
# - Run it by hand with a ref (a branch, a tag, a commit, or pr-<n>) to build
#   that aube and add it to the page as ?ref=<name>. Without a ref it only
#   redeploys the site.
# - Every day it builds aube's main, when main has moved.
# - A push to main that changes the site redeploys it.
#
# Builds live on the `builds` branch (builds.json and <tool>/<name>/),
# rewritten as a single commit whenever one is added, so old builds do not
# pile up in its history. The site is the page and the bundle from main plus
# those builds, deployed with actions/deploy-pages.
name: Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "aube ref to build: branch, tag, commit, or pr-<number>. Empty: only redeploy the site."
        required: false
        default: ""
      force:
        description: "Build even if this ref's commit is already published."
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "fixtures/**"
      - "packages/terrarium/src/**"
      - "packages/terrarium/scripts/**"
      - "packages/terrarium/package.json"
      - "packages/terrarium/bun.lock"
      - "scripts/assemble-pages.sh"
      - "scripts/load-builds.sh"
      - "scripts/stage-web.sh"
      - "mise.toml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository_owner == 'aletheia-works'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      name: ${{ steps.resolve.outputs.name }}
      ref: ${{ steps.resolve.outputs.ref }}
      commit: ${{ steps.resolve.outputs.commit }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event_name == 'schedule' && 'main' || inputs.ref }}
        run: |
          if [ -n "$REF" ]; then scripts/resolve-aube-ref.sh "$REF" | tee -a "$GITHUB_OUTPUT"; fi
      - id: check
        env:
          NAME: ${{ steps.resolve.outputs.name }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          if [ -z "$NAME" ]; then echo build=false >>"$GITHUB_OUTPUT"; exit 0; fi
          scripts/load-builds.sh >/dev/null
          published=$(jq -r --arg n "$NAME" '.builds.aube[$n].source.commit // empty' web/dist/builds.json 2>/dev/null || true)
          if [ "$published" = "$COMMIT" ] && [ "$FORCE" != true ]; then
            echo "$NAME is already published at $COMMIT"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EMSDK: ${{ github.workspace }}/../emsdk
      EMSDK_VERSION: "6.0.10"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Install the Rust toolchain
        run: |
          toolchain=$(basename patches/toolchain/rust-std-*.patch .patch)
          # The prebuilt std is not linked (build-std replaces it), but build scripts
          # such as indexmap 1.x probe for std with it.
          rustup toolchain install "${toolchain#rust-std-}" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Download aube ${{ needs.resolve.outputs.ref }}
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          mkdir -p ../aube
          curl -fsSL "https://codeload.github.com/aubepkg/aube/tar.gz/$COMMIT" | tar -xz -C ../aube --strip-components=1
      # Restored and saved separately, so that a failed build still saves the
      # compiled dependencies for the next attempt.
      - name: Restore cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ needs.resolve.outputs.commit }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('patches/**') }}-
      - name: Build
        run: scripts/build-aube.sh ../aube "$RUNNER_TEMP/out"
      - name: Save cargo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aube-${{ needs.resolve.outputs.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  # Add the new build to the `builds` branch, starting again from the branch
  # if another run stored a build in between.
  store:
    needs: [resolve, build]
    if: github.repository_owner == 'aletheia-works' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: builds-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aube-${{ needs.resolve.outputs.name }}
          path: ${{ runner.temp }}/out
      - name: Store the build on the builds branch
        env:
          NAME: ${{ needs.resolve.outputs.name }}
          TERRARIUM_REF: ${{ needs.resolve.outputs.ref }}
          TERRARIUM_COMMIT: ${{ needs.resolve.outputs.commit }}
          TERRARIUM_PR: ${{ needs.resolve.outputs.pr }}
          TERRARIUM_SOURCE_URL: https://github.com/aubepkg/aube
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            base=$(scripts/load-builds.sh | sed -n 's/^base=//p')
            scripts/stage-web.sh aube "$NAME" "$RUNNER_TEMP/out"
            rm -rf web/dist/fixtures
            export GIT_INDEX_FILE=$RUNNER_TEMP/builds-index
            rm -f "$GIT_INDEX_FILE"
            git --work-tree=web/dist add --all
            tree=$(git write-tree)
            unset GIT_INDEX_FILE
            commit=$(git commit-tree "$tree" -m "Store aube $NAME (${TERRARIUM_COMMIT::8})")
            if git push --force-with-lease="builds:$base" origin "$commit:refs/heads/builds"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

  site:
    needs: [resolve, build, store]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.store.result == 'success' || needs.store.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise (bun)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun
      - name: Install the package's dependencies
        working-directory: packages/terrarium
        run: bun install --frozen-lockfile
      - name: Assemble the site with the published builds
        run: |
          scripts/load-builds.sh
          scripts/stage-web.sh
          mise run site:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
