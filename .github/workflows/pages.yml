# Build the tools for the browser terminal and publish the site on GitHub
# Pages. The tools are the keys of web/tools.json; each is built by
# the registered native builder.
#
# - Run it by hand with a tool and a ref (a branch, a tag, a commit, or
#   pr-<n>) to build that ref and add it to the page as ?tool=<tool>&ref=<name>.
#   Without a ref it only redeploys the site.
# - Every day and on site changes, build and verify every latest stable
#   native guest before deploying. Manual refs use the same native guest pipeline.
# - A push to main that changes the site redeploys it.
#
# Every candidate includes latest stable releases and configured native refs.
# A manual ref is added for this deployment; configure it in web/tool-refs.json
# to retain it across later deployments.
name: Pages

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build, a key of web/tools.json."
        type: string
        default: aube
      ref:
        description: "Ref to build: branch, tag, commit, or pr-<number>. Empty: only redeploy the site."
        required: false
        default: ""
      repository:
        description: "Optional source repository or fork (owner/repo); defaults to the registered tool."
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "fixtures/**"
      - "packages/terrarium/src/**"
      - "packages/terrarium/scripts/**"
      - "packages/terrarium/package.json"
      - "packages/terrarium/bun.lock"
      - "scripts/**"
      - "mise-tasks/**"
      - ".github/workflows/build-latest-guests.yml"
      - "mise.toml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  latest-guests:
    if: github.repository_owner == 'aletheia-works'
    uses: ./.github/workflows/build-latest-guests.yml
    with:
      ref_repository: ${{ inputs.repository || '' }}
      ref_tool: ${{ inputs.tool || '' }}
      tool_ref: ${{ inputs.ref || '' }}

  site:
    needs: latest-guests
    if: github.repository_owner == 'aletheia-works' && needs.latest-guests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise (bun)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node
      - name: Prepare fixed formicarium inputs
        working-directory: .
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          : "${FORMICARIUM_INPUTS_URL:?Configure the fixed formicarium input archive URL}"
          bash mise-tasks/terrarium/prepare.sh --url "$FORMICARIUM_INPUTS_URL"
      - name: Install the package's dependencies
        working-directory: packages/terrarium
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latest-guests
          path: .vendor/latest-guests
      - name: Assemble the verified native guest catalogue
        env:
          TERRARIUM_GUEST_SITE: .vendor/latest-guests
        run: |
          mise run site:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site

  deploy:
    needs: site
    if: always() && github.repository_owner == 'aletheia-works' && needs.site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
