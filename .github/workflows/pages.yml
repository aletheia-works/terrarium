# Build the tools for the browser terminal and publish the site on GitHub
# Pages. The tools are the keys of web/tools.json; each is built by
# scripts/build-<tool>.sh.
#
# - Run it by hand with a tool and a ref (a branch, a tag, a commit, or
#   pr-<n>) to build that ref and add it to the page as ?tool=<tool>&ref=<name>.
#   Without a ref it only redeploys the site.
# - Every day and on site changes, build and verify every latest stable
#   native guest before deploying. Manual refs still create legacy builds.
# - A push to main that changes the site redeploys it.
#
# Builds live on the `builds` branch (builds.json and <tool>/<name>/),
# rewritten as a single commit whenever one is added, so old builds do not
# pile up in its history. The site is the page and the bundle from main plus
# those builds, deployed with actions/deploy-pages.
name: Pages

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to build, a key of web/tools.json."
        type: choice
        options: [aube, pitchfork]
        default: aube
      ref:
        description: "Ref to build: branch, tag, commit, or pr-<number>. Empty: only redeploy the site."
        required: false
        default: ""
      force:
        description: "Build even if this ref's commit is already published."
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "fixtures/**"
      - "packages/terrarium/src/**"
      - "packages/terrarium/scripts/**"
      - "packages/terrarium/package.json"
      - "packages/terrarium/bun.lock"
      - "scripts/**"
      - "patches/guests/**"
      - ".github/workflows/build-latest-guests.yml"
      - "scripts/load-builds.sh"
      - "scripts/stage-web.sh"
      - "mise.toml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  latest-guests:
    if: github.repository_owner == 'aletheia-works'
    uses: ./.github/workflows/build-latest-guests.yml

  # The builds to make, as a JSON list of resolve-ref.sh outputs, leaving out
  # the ones already published at the same commit.
  resolve:
    if: github.repository_owner == 'aletheia-works'
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TOOL: ${{ inputs.tool }}
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          if [ -n "$REF" ]; then
            wanted="$TOOL"
          else
            wanted=
          fi
          scripts/load-builds.sh >/dev/null
          builds='[]'
          for tool in $wanted; do
            # Without a ref, resolve-ref.sh takes the tool's default.
            build=$(scripts/resolve-ref.sh "$tool" ${REF:+"$REF"} |
              jq -Rn '[inputs | capture("^(?<key>[^=]+)=(?<value>.*)$")] | from_entries')
            name=$(jq -r .name <<<"$build")
            commit=$(jq -r .commit <<<"$build")
            published=$(jq -r --arg t "$tool" --arg n "$name" '.builds[$t][$n].source.commit // empty' web/dist/builds.json 2>/dev/null || true)
            if [ "$published" = "$commit" ] && [ "$FORCE" != true ]; then
              echo "$tool $name is already published at $commit"
            else
              builds=$(jq -c --argjson b "$build" '. + [$b]' <<<"$builds")
            fi
          done
          echo "builds=$builds" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.builds != '[]'
    name: build (${{ matrix.tool }} ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.builds) }}
    env:
      EMSDK_VERSION: "6.0.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set cache-compatible build directories
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/$TOOL-target" >> "$GITHUB_ENV"
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Install the Rust toolchain
        run: |
          toolchain=$(basename patches/toolchain/rust-std-*.patch .patch)
          # The prebuilt std is not linked (build-std replaces it), but build scripts
          # such as indexmap 1.x probe for std with it.
          rustup toolchain install "${toolchain#rust-std-}" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Download ${{ matrix.tool }} ${{ matrix.ref }}
        env:
          REPO: ${{ matrix.repo }}
          COMMIT: ${{ matrix.commit }}
        run: |
          mkdir -p ../src
          curl -fsSL "https://codeload.github.com/$REPO/tar.gz/$COMMIT" | tar -xz -C ../src --strip-components=1
      # Restored and saved separately, so that a failed build still saves the
      # compiled dependencies for the next attempt.
      - name: Restore cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ matrix.tool }}-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ matrix.commit }}
          restore-keys: cargo-${{ matrix.tool }}-${{ runner.os }}-${{ hashFiles('patches/**') }}-
      - name: Build
        env:
          TOOL: ${{ matrix.tool }}
        run: '"scripts/build-$TOOL.sh" ../src "$RUNNER_TEMP/out"'
      - name: Save cargo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ matrix.tool }}-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ matrix.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record what was built
        env:
          BUILD: ${{ toJSON(matrix) }}
        run: jq . <<<"$BUILD" >"$RUNNER_TEMP/out/build.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.tool }}-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  # Add the new builds to the `builds` branch, starting again from the branch
  # if another run stored a build in between. A build that failed is left
  # out; the others are still stored.
  store:
    needs: [resolve, build]
    if: >-
      always() && github.repository_owner == 'aletheia-works' &&
      (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: builds-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: ${{ runner.temp }}/builds
      - name: Store the builds on the builds branch
        run: |
          shopt -s nullglob
          # download-artifact extracts a single match directly into path.
          if [ -f "$RUNNER_TEMP/builds/build.json" ]; then
            dirs=("$RUNNER_TEMP/builds/")
          else
            dirs=("$RUNNER_TEMP"/builds/*/)
          fi
          if [ ${#dirs[@]} -eq 0 ]; then echo "no build succeeded"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            base=$(scripts/load-builds.sh | sed -n 's/^base=//p')
            stored=()
            for dir in "${dirs[@]}"; do
              build=$dir/build.json
              tool=$(jq -r .tool "$build")
              name=$(jq -r .name "$build")
              commit=$(jq -r .commit "$build")
              TERRARIUM_REF=$(jq -r .ref "$build") \
                TERRARIUM_COMMIT=$commit \
                TERRARIUM_PR=$(jq -r .pr "$build") \
                TERRARIUM_SOURCE_URL=https://github.com/$(jq -r .repo "$build") \
                scripts/stage-web.sh "$tool" "$name" "$dir"
              stored+=("$tool $name (${commit::8})")
            done
            rm -rf web/dist/fixtures
            export GIT_INDEX_FILE=$RUNNER_TEMP/builds-index
            rm -f "$GIT_INDEX_FILE"
            git --work-tree=web/dist add --all
            tree=$(git write-tree)
            unset GIT_INDEX_FILE
            stored_summary=$(IFS=,; echo "${stored[*]}")
            message="Store ${stored_summary//,/, }"
            commit=$(git commit-tree "$tree" -m "$message")
            if git push --force-with-lease="builds:$base" origin "$commit:refs/heads/builds"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

  site:
    needs: [resolve, build, store, latest-guests]
    if: >-
      always() && needs.latest-guests.result == 'success' && needs.resolve.result == 'success' &&
      needs.build.result != 'cancelled' &&
      (needs.store.result == 'success' || needs.store.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise (bun)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node
      - name: Prepare fixed formicarium inputs
        working-directory: .
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          : "${FORMICARIUM_INPUTS_URL:?Configure the fixed formicarium input archive URL}"
          bun scripts/prepare-formicarium.mjs --url "$FORMICARIUM_INPUTS_URL"
          node scripts/fetch-formicarium-rc.mjs
      - name: Install the package's dependencies
        working-directory: packages/terrarium
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latest-guests
          path: .vendor/latest-guests
      - name: Assemble the site with the published builds
        env:
          TERRARIUM_GUEST_SITE: .vendor/latest-guests
        run: |
          scripts/load-builds.sh
          scripts/stage-web.sh
          mise run site:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site

  deploy:
    needs: site
    # Without always(), a job is skipped when any job upstream of it was, and
    # build and store are skipped whenever nothing is built.
    if: always() && github.repository_owner == 'aletheia-works' && needs.site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
