name: publish-terrarium

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish or resume (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # OIDC for both npm provenance and JSR

concurrency:
  group: publish-terrarium-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JSR + npm
    if: github.repository == 'aletheia-works/terrarium'
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/terrarium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node jq

      - name: Prepare fixed formicarium inputs
        working-directory: .
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          : "${FORMICARIUM_INPUTS_URL:?Configure the fixed formicarium input archive URL}"
          bash mise-tasks/terrarium/prepare.sh --url "$FORMICARIUM_INPUTS_URL"
      - name: Install + build + test
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

      - name: Validate release and check both registries
        id: release
        run: bun run check:version --registries

      - name: Publish to npm (provenance via OIDC trusted publishing, npm CLI run through bunx)
        if: steps.release.outputs.npm_skip == 'false'
        # Bun cannot publish over OIDC (oven-sh/bun#15601), and older npm
        # minors mask trusted-publishing failures as ENEEDAUTH (npm/cli#9088).
        run: bunx npm@latest publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org/'

      - name: Publish to JSR (provenance via OIDC)
        if: steps.release.outputs.jsr_skip == 'false'
        run: bunx jsr publish

      - name: Summary
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo ""
            echo "* **npm**: https://www.npmjs.com/package/@aletheia-works/terrarium"
            echo "* **JSR**: https://jsr.io/@aletheia-works/terrarium"
            echo ""
            echo "Provenance is recorded in the public Sigstore Rekor"
            echo "transparency log for both registries."
          } >> "$GITHUB_STEP_SUMMARY"
