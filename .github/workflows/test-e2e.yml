name: Test E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pitchfork-ref:
    name: Resolve latest stable pitchfork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pitchfork-ref.outputs.name }}
      commit: ${{ steps.pitchfork-ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise (jq)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: jq
      - name: Resolve latest stable pitchfork once
        id: pitchfork-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-ref.sh pitchfork latest >> "$GITHUB_OUTPUT"

  pitchfork-build:
    needs: pitchfork-ref
    name: Build latest stable pitchfork
    outputs:
      ref: ${{ needs.pitchfork-ref.outputs.ref }}
      commit: ${{ needs.pitchfork-ref.outputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EMSDK_VERSION: "6.0.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set cache-compatible build directories
        run: |
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pitchfork-target" >> "$GITHUB_ENV"
      - name: Cache the resolved pitchfork build
        id: pitchfork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/out/
          # Include the build's script dependencies and linker inputs; unrelated
          # fetch, staging and lint scripts do not change the compiled artifact.
          key: pitchfork-${{ runner.os }}-${{ needs.pitchfork-ref.outputs.commit }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('patches/**', 'runtime/syscalls.c', 'runtime/libterrarium.js', 'scripts/build-pitchfork.sh', 'scripts/emscripten-env.sh', 'scripts/patch-rust-src.sh', 'scripts/vendor-patched.sh') }}
      - name: Install Ninja
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Cache emsdk
        if: steps.pitchfork.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Install the Rust toolchain
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: |
          toolchain=$(basename patches/toolchain/rust-std-*.patch .patch)
          rustup toolchain install "${toolchain#rust-std-}" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Download the resolved pitchfork source
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: |
          mkdir -p ../src
          curl -fsSL https://codeload.github.com/jdx/pitchfork/tar.gz/${{ needs.pitchfork-ref.outputs.commit }} | tar -xz -C ../src --strip-components=1
      - name: Restore cargo cache
        if: steps.pitchfork.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-pitchfork-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ needs.pitchfork-ref.outputs.commit }}
          restore-keys: cargo-pitchfork-${{ runner.os }}-${{ hashFiles('patches/**') }}-
      - name: Build
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: scripts/build-pitchfork.sh ../src "$RUNNER_TEMP/out"
      - name: Save cargo cache
        if: always() && steps.pitchfork.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-pitchfork-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ needs.pitchfork-ref.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the build artifacts
        run: test -s "$RUNNER_TEMP/out/pitchfork.js" && test -s "$RUNNER_TEMP/out/pitchfork.wasm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchfork-${{ needs.pitchfork-ref.outputs.ref }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  aube-build:
    name: Build fixed legacy aube
    outputs:
      ref: ${{ steps.identity.outputs.ref }}
      commit: ${{ steps.identity.outputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Fixed regression input; latest aube is exercised by latest / guests.
      AUBE_REF: "v2.6.1"
      AUBE_COMMIT: "bd94e42f54d3b5e3dd102716b7197f316cb5f4ed"
      EMSDK_VERSION: "6.0.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the fixed regression source
        id: identity
        run: |
          echo "ref=$AUBE_REF" >> "$GITHUB_OUTPUT"
          echo "commit=$AUBE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Set cache-compatible build directories
        run: |
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/aube-target" >> "$GITHUB_ENV"
      - name: Cache the fixed aube build
        id: aube
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/out/
          # Include the build's script dependencies and linker inputs; unrelated
          # fetch, staging and lint scripts do not change the compiled artifact.
          key: aube-${{ runner.os }}-${{ env.AUBE_COMMIT }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('patches/**', 'runtime/syscalls.c', 'runtime/libterrarium.js', 'scripts/build-aube.sh', 'scripts/emscripten-env.sh', 'scripts/patch-rust-src.sh', 'scripts/vendor-patched.sh') }}
      - name: Install Ninja
        if: steps.aube.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Cache emsdk
        if: steps.aube.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        if: steps.aube.outputs.cache-hit != 'true'
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Install the Rust toolchain
        if: steps.aube.outputs.cache-hit != 'true'
        run: |
          toolchain=$(basename patches/toolchain/rust-std-*.patch .patch)
          rustup toolchain install "${toolchain#rust-std-}" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Download the fixed aube source
        if: steps.aube.outputs.cache-hit != 'true'
        run: |
          mkdir -p ../src
          curl -fsSL https://codeload.github.com/aubepkg/aube/tar.gz/${{ env.AUBE_COMMIT }} | tar -xz -C ../src --strip-components=1
      - name: Restore cargo cache
        if: steps.aube.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-aube-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ env.AUBE_COMMIT }}
          restore-keys: cargo-aube-${{ runner.os }}-${{ hashFiles('patches/**') }}-
      - name: Build
        if: steps.aube.outputs.cache-hit != 'true'
        run: scripts/build-aube.sh ../src "$RUNNER_TEMP/out"
      - name: Save cargo cache
        if: always() && steps.aube.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-aube-${{ runner.os }}-${{ hashFiles('patches/**') }}-${{ env.AUBE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the build artifacts
        run: test -s "$RUNNER_TEMP/out/aube.js" && test -s "$RUNNER_TEMP/out/aube.wasm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aube-${{ env.AUBE_REF }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  e2e:
    needs: [pitchfork-build, aube-build]
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERRARIUM_PITCHFORK_REF: ${{ needs.pitchfork-build.outputs.ref }}
      TERRARIUM_PITCHFORK_COMMIT: ${{ needs.pitchfork-build.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node jq

      - name: Prepare fixed formicarium inputs
        working-directory: .
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          : "${FORMICARIUM_INPUTS_URL:?Configure the fixed formicarium input archive URL}"
          bun scripts/prepare-formicarium.mjs --url "$FORMICARIUM_INPUTS_URL"
          node scripts/fetch-formicarium-rc.mjs

      - name: Install dependencies
        working-directory: packages/terrarium
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitchfork-${{ needs.pitchfork-build.outputs.ref }}
          path: ${{ runner.temp }}/pitchfork

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aube-${{ needs.aube-build.outputs.ref }}
          path: ${{ runner.temp }}/aube

      # Keep the fixed aube regression while building against this PR's runtime.
      # Production releases are independently covered by latest / guests.
      - name: Stage the same-run legacy builds and assemble the sites
        env:
          AUBE_REF: ${{ needs.aube-build.outputs.ref }}
          AUBE_COMMIT: ${{ needs.aube-build.outputs.commit }}
        run: |
          TERRARIUM_SOURCE_URL=https://github.com/aubepkg/aube TERRARIUM_REF="$AUBE_REF" TERRARIUM_COMMIT="$AUBE_COMMIT" \
            bash scripts/stage-web.sh aube "$AUBE_REF" "$RUNNER_TEMP/aube"
          TERRARIUM_PITCHFORK_BUILD="$RUNNER_TEMP/pitchfork" bash scripts/prepare-pitchfork-e2e.sh
          bash scripts/stage-web.sh
          bash scripts/assemble-pages.sh .vendor/site-legacy legacy
          bash scripts/assemble-pages.sh .vendor/site-formicarium formicarium
          sha256sum .vendor/site-legacy/web/terrarium.mjs .vendor/site-formicarium/web/terrarium.mjs
          sha256sum packages/terrarium/src/{terminal,formicarium-session,catalog}.ts

      - name: Cache Playwright system packages (${{ matrix.browser }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/terrarium-pw-apt
          key: pw-apt-${{ runner.os }}-${{ env.ImageOS }}-${{ matrix.browser }}-${{ hashFiles('packages/terrarium/bun.lock') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        working-directory: packages/terrarium
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/terrarium-pw-apt"
          mkdir -p "$cache_dir/partial"
          chmod -R a+rwX "$cache_dir"
          printf 'Dir::Cache::archives "%s";\n' "$cache_dir" \
            | sudo tee /etc/apt/apt.conf.d/99-terrarium-pw-cache > /dev/null

          bunx playwright install --with-deps ${{ matrix.browser }}

          sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
          rm -rf "$cache_dir/partial" "$cache_dir/lock"
          echo "Cached $(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l) .deb(s)."

      - name: Run Playwright suite (${{ matrix.browser }})
        working-directory: packages/terrarium
        run: |
          TERRARIUM_BUN=$(command -v bun)
          export TERRARIUM_BUN
          export TERRARIUM_SITE_DIR="$GITHUB_WORKSPACE/.vendor/site-legacy"
          bun run test:e2e -- --project=${{ matrix.browser }}
          export TERRARIUM_SITE_DIR="$GITHUB_WORKSPACE/.vendor/site-formicarium"
          bunx playwright test --config playwright.formicarium.config.ts --project=${{ matrix.browser }} --workers=1 --retries=0

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/terrarium/playwright-report/
          retention-days: 7
