name: Test E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pitchfork-build:
    name: Build pitchfork v2.29.0
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EMSDK_VERSION: "6.0.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set cache-compatible build directories
        run: |
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pitchfork-target" >> "$GITHUB_ENV"
      - name: Cache the fixed pitchfork build
        id: pitchfork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/out/
          key: pitchfork-${{ runner.os }}-cfdea79f1d52b8449c0b99b29a03d9e771cd8ec3-${{ env.EMSDK_VERSION }}-${{ hashFiles('patches/**', 'runtime/**', 'scripts/**', '.github/workflows/test-e2e.yml') }}
      - name: Install Ninja
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Cache emsdk
        if: steps.pitchfork.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Install the Rust toolchain
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: |
          toolchain=$(basename patches/toolchain/rust-std-*.patch .patch)
          rustup toolchain install "${toolchain#rust-std-}" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Download the fixed pitchfork source
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: |
          mkdir -p ../src
          curl -fsSL https://codeload.github.com/jdx/pitchfork/tar.gz/cfdea79f1d52b8449c0b99b29a03d9e771cd8ec3 | tar -xz -C ../src --strip-components=1
      - name: Restore cargo cache
        if: steps.pitchfork.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-pitchfork-${{ runner.os }}-${{ hashFiles('patches/**') }}-cfdea79f1d52b8449c0b99b29a03d9e771cd8ec3
          restore-keys: cargo-pitchfork-${{ runner.os }}-${{ hashFiles('patches/**') }}-
      - name: Build
        if: steps.pitchfork.outputs.cache-hit != 'true'
        run: scripts/build-pitchfork.sh ../src "$RUNNER_TEMP/out"
      - name: Save cargo cache
        if: always() && steps.pitchfork.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-pitchfork-${{ runner.os }}-${{ hashFiles('patches/**') }}-cfdea79f1d52b8449c0b99b29a03d9e771cd8ec3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the build artifacts
        run: test -s "$RUNNER_TEMP/out/pitchfork.js" && test -s "$RUNNER_TEMP/out/pitchfork.wasm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchfork-v2.29.0
          path: ${{ runner.temp }}/out/
          retention-days: 7

  e2e:
    needs: pitchfork-build
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: Install dependencies
        working-directory: packages/terrarium
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitchfork-v2.29.0
          path: ${{ runner.temp }}/pitchfork

      # The tests run the published v2.6.1 build of aube, a tag that never
      # moves, against this pull request's page, element, Session and
      # fixtures (staged into web/dist/fixtures by stage-web.sh).
      - name: Fetch the v2.6.1 build and assemble the site
        run: |
          bash scripts/fetch-builds.sh v2.6.1
          TERRARIUM_COMMIT=cfdea79f1d52b8449c0b99b29a03d9e771cd8ec3 \
            bash scripts/stage-web.sh pitchfork v2.29.0 "$RUNNER_TEMP/pitchfork"
          bash scripts/stage-web.sh
          mise run site:build

      - name: Cache Playwright system packages (${{ matrix.browser }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/terrarium-pw-apt
          key: pw-apt-${{ runner.os }}-${{ env.ImageOS }}-${{ matrix.browser }}-${{ hashFiles('packages/terrarium/bun.lock') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        working-directory: packages/terrarium
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/terrarium-pw-apt"
          mkdir -p "$cache_dir/partial"
          chmod -R a+rwX "$cache_dir"
          printf 'Dir::Cache::archives "%s";\n' "$cache_dir" \
            | sudo tee /etc/apt/apt.conf.d/99-terrarium-pw-cache > /dev/null

          bunx playwright install --with-deps ${{ matrix.browser }}

          sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
          rm -rf "$cache_dir/partial" "$cache_dir/lock"
          echo "Cached $(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l) .deb(s)."

      - name: Run Playwright suite (${{ matrix.browser }})
        working-directory: packages/terrarium
        run: bun run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/terrarium/playwright-report/
          retention-days: 7
