name: Test terrarium package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-terrarium-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test terrarium package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/terrarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: Install, type-check, test and build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
