name: Test terrarium package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-terrarium-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test terrarium package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/terrarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun node jq

      - name: Prepare fixed formicarium inputs
        working-directory: .
        env:
          FORMICARIUM_INPUTS_URL: ${{ vars.FORMICARIUM_INPUTS_URL || 'https://raw.githubusercontent.com/Marukome0743/terrarium/74baa1101ebf6d8fc310ea70de3ddc071a87c01f/inputs.tar.gz' }}
        run: |
          : "${FORMICARIUM_INPUTS_URL:?Configure the fixed formicarium input archive URL}"
          bun scripts/prepare-formicarium.mjs --url "$FORMICARIUM_INPUTS_URL"
          node scripts/fetch-formicarium-rc.mjs

      - name: Install, type-check, test and build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
