[global]
include = ["**/*.md"]

exclude = [
  ".git",
  ".jj",
  ".claude",
  ".codex",
  ".agents/skills",
  ".vendor",
  "node_modules",
  "dist",
  "aidlc/spaces/*/memory/**",
  "aidlc/spaces/*/intents/*/aidlc-state.md",
  "aidlc/spaces/*/intents/*/audit/**",
  "aidlc/spaces/*/intents/*/**/memory.md",
  "aidlc/spaces/*/intents/*/**/*-questions.md",
  "aidlc/spaces/*/intents/*/verification/**",
  "**/CHANGELOG.md",
  "**/node_modules/**",
]

disable = ["MD013", "MD033", "MD036", "MD041", "MD057"]

respect-gitignore = true

flavor = "gfm"
