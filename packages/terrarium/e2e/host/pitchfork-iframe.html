<!doctype html>
<meta charset="utf-8" />
<title>pitchfork same-origin iframe</title>
<!-- Served on the site's origin by the test: no credentialless dependency. -->
<iframe id="frame" title="pitchfork" allow="cross-origin-isolated"></iframe>
<script>
  window.messages = [];
  const frame = document.getElementById('frame');
  addEventListener('message', (event) => {
    if (event.source === frame.contentWindow && event.origin === location.origin)
      messages.push({ origin: event.origin, ...event.data });
  });
  frame.src = `/web/?embed&tool=pitchfork&ref=v2.29.0&origin=${encodeURIComponent(location.origin)}`;
  window.runInFrame = (command) =>
    frame.contentWindow.postMessage({ type: 'terrarium:run', command }, location.origin);
</script>
